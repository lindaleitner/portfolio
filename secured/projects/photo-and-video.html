    <!-- CSS für die Lightbox direkt hier (oder in photo.css einfügen) -->
    <style>
        .lightbox {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox-content {
            max-width: 90%;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 4px;
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 35px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }

        .lightbox-prev, .lightbox-next {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 16px 20px;
            font-size: 24px;
            cursor: pointer;
            border-radius: 4px;
            user-select: none;
        }

        .lightbox-prev:hover, .lightbox-next:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .lightbox-prev { left: 20px; }
        .lightbox-next { right: 20px; }

        .photo-item img {
            cursor: pointer;
        }
    </style>
</head>

<!-- Lightbox Modal -->
<div id="lightbox" class="lightbox">
    <span class="lightbox-close">&times;</span>
    <button class="lightbox-prev">&#10094;</button>
    <img class="lightbox-content" id="lightbox-img" alt="Vergrößertes Bild">
    <button class="lightbox-next">&#10095;</button>
</div>

<script>
    // Foto-Filter
    const filterBtns = document.querySelectorAll('.filter-btn');
    const photoItems = document.querySelectorAll('.photo-item');

    filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelector('.filter-btn.active').classList.remove('active');
            btn.classList.add('active');

            const filter = btn.getAttribute('data-filter');

            photoItems.forEach(item => {
                if (filter === 'all' || item.classList.contains(filter)) {
                    item.style.display = 'block';
                } else {
                    item.style.display = 'none';
                }
            });
        });
    });

    // Video Navigation
    const videos = document.querySelectorAll('.heroVideo');
    const prevBtn = document.getElementById('prevVideo');
    const nextBtn = document.getElementById('nextVideo');
    let currentIndex = 0;

    function showVideo(index) {
        videos.forEach((video) => {
            video.classList.remove('active');

            if (video.tagName.toLowerCase() === 'video') {
                video.pause();
                video.currentTime = 0;
            }

            if (video.tagName.toLowerCase() === 'iframe') {
                video.src = video.src;
            }
        });

        const activeVideo = videos[index];
        if (activeVideo) {
            activeVideo.classList.add('active');

            if (activeVideo.tagName.toLowerCase() === 'video') {
                activeVideo.play();
            }
        }
    }

    if (prevBtn && nextBtn && videos.length > 0) {
        nextBtn.addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % videos.length;
            showVideo(currentIndex);
        });

        prevBtn.addEventListener('click', () => {
            currentIndex = (currentIndex - 1 + videos.length) % videos.length;
            showVideo(currentIndex);
        });

        showVideo(currentIndex);
    }

    // --- Lightbox / Modal Logik ---
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const closeBtn = document.querySelector('.lightbox-close');
    const prevImgBtn = document.querySelector('.lightbox-prev');
    const nextImgBtn = document.querySelector('.lightbox-next');

    let currentVisibleImages = [];
    let currentImageIndex = 0;

    // KORRIGIERTE Hilfsfunktion: Erkennt Bilder jetzt auch beim ersten Aufruf richtig!
    function getVisibleImages() {
        return Array.from(document.querySelectorAll('.photo-item'))
            .filter(item => getComputedStyle(item).display !== 'none')
            .map(item => item.querySelector('img'));
    }

    function openLightbox(index) {
        currentVisibleImages = getVisibleImages();
        if (currentVisibleImages.length === 0) return;

        currentImageIndex = index;
        lightboxImg.src = currentVisibleImages[currentImageIndex].src;
        lightboxImg.alt = currentVisibleImages[currentImageIndex].alt;
        lightbox.classList.add('active');
    }

    // Event Listener für jedes Bild
    photoItems.forEach(item => {
        const img = item.querySelector('img');
        if (img) {
            img.addEventListener('click', () => {
                const visibleImgs = getVisibleImages();
                const index = visibleImgs.indexOf(img);
                if (index !== -1) {
                    openLightbox(index);
                }
            });
        }
    });

    // Schließen
    closeBtn.addEventListener('click', () => {
        lightbox.classList.remove('active');
    });

    lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox) {
            lightbox.classList.remove('active');
        }
    });

    // Vor / Zurück
    nextImgBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (currentVisibleImages.length === 0) return;
        currentImageIndex = (currentImageIndex + 1) % currentVisibleImages.length;
        lightboxImg.src = currentVisibleImages[currentImageIndex].src;
        lightboxImg.alt = currentVisibleImages[currentImageIndex].alt;
    });

    prevImgBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (currentVisibleImages.length === 0) return;
        currentImageIndex = (currentImageIndex - 1 + currentVisibleImages.length) % currentVisibleImages.length;
        lightboxImg.src = currentVisibleImages[currentImageIndex].src;
        lightboxImg.alt = currentVisibleImages[currentImageIndex].alt;
    });

    // Tastatur-Navigation
    document.addEventListener('keydown', (e) => {
        if (!lightbox.classList.contains('active')) return;

        if (e.key === 'Escape') {
            lightbox.classList.remove('active');
        } else if (e.key === 'ArrowRight') {
            nextImgBtn.click();
        } else if (e.key === 'ArrowLeft') {
            prevImgBtn.click();
        }
    });
</script>
