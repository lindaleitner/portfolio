<!-- Lightbox Modal -->
<div id="lightbox" class="lightbox">
    <span class="lightbox-close">&times;</span>
    <button class="lightbox-prev">&#10094;</button>
    <img class="lightbox-content" id="lightbox-img" alt="Vergrößertes Bild">
    <button class="lightbox-next">&#10095;</button>
</div>

<script>
    // Foto-Filter
    const filterBtns = document.querySelectorAll('.filter-btn');
    const photoItems = document.querySelectorAll('.photo-item');

    filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelector('.filter-btn.active').classList.remove('active');
            btn.classList.add('active');

            const filter = btn.getAttribute('data-filter');

            photoItems.forEach(item => {
                if (filter === 'all' || item.classList.contains(filter)) {
                    item.style.display = 'block';
                } else {
                    item.style.display = 'none';
                }
            });
        });
    });

    // Video Navigation
    const videos = document.querySelectorAll('.heroVideo');
    const prevBtn = document.getElementById('prevVideo');
    const nextBtn = document.getElementById('nextVideo');
    let currentIndex = 0;

    function showVideo(index) {
        videos.forEach((video, i) => {
            video.classList.remove('active');

            // Stoppe nur HTML-Videos, nicht iframes
            if (video.tagName.toLowerCase() === 'video') {
                video.pause();
                video.currentTime = 0;
            }

            // Stoppe YouTube-Video (setzt autoplay ab)
            if (video.tagName.toLowerCase() === 'iframe') {
                video.src = video.src; // reload to stop playback
            }
        });

        const activeVideo = videos[index];
        activeVideo.classList.add('active');

        // Falls HTML-Video: starte es
        if (activeVideo.tagName.toLowerCase() === 'video') {
            activeVideo.play();
        }
    }

    nextBtn.addEventListener('click', () => {
        currentIndex = (currentIndex + 1) % videos.length;
        showVideo(currentIndex);
    });

    prevBtn.addEventListener('click', () => {
        currentIndex = (currentIndex - 1 + videos.length) % videos.length;
        showVideo(currentIndex);
    });

    // Start mit erstem Video
    showVideo(currentIndex);

    //Gallery Lightbox
    // --- Lightbox / Modal Logik ---
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const closeBtn = document.querySelector('.lightbox-close');
    const prevImgBtn = document.querySelector('.lightbox-prev');
    const nextImgBtn = document.querySelector('.lightbox-next');

    let currentVisibleImages = [];
    let currentImageIndex = 0;

    // Hilfsfunktion: Ermittelt alle aktuell sichtbaren Bilder
    function getVisibleImages() {
        return Array.from(document.querySelectorAll('.photo-item'))
            .filter(item => item.style.display !== 'none')
            .map(item => item.querySelector('img'));
    }

    // Öffnet das Bild am gegebenen Index
    function openLightbox(index) {
        currentVisibleImages = getVisibleImages();
        if (currentVisibleImages.length === 0) return;

        currentImageIndex = index;
        lightboxImg.src = currentVisibleImages[currentImageIndex].src;
        lightboxImg.alt = currentVisibleImages[currentImageIndex].alt;
        lightbox.classList.add('active');
    }

    // Klick-Event auf alle Bild-Container
    photoItems.forEach(item => {
        const img = item.querySelector('img');
        img.addEventListener('click', () => {
            const visibleImgs = getVisibleImages();
            const index = visibleImgs.indexOf(img);
            if (index !== -1) {
                openLightbox(index);
            }
        });
    });

    // Schließen
    closeBtn.addEventListener('click', () => {
        lightbox.classList.remove('active');
    });

    // Klick außerhalb des Bildes schließt ebenfalls
    lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox) {
            lightbox.classList.remove('active');
        }
    });

    // Nächstes Bild
    nextImgBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        currentImageIndex = (currentImageIndex + 1) % currentVisibleImages.length;
        lightboxImg.src = currentVisibleImages[currentImageIndex].src;
        lightboxImg.alt = currentVisibleImages[currentImageIndex].alt;
    });

    // Vorheriges Bild
    prevImgBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        currentImageIndex = (currentImageIndex - 1 + currentVisibleImages.length) % currentVisibleImages.length;
        lightboxImg.src = currentVisibleImages[currentImageIndex].src;
        lightboxImg.alt = currentVisibleImages[currentImageIndex].alt;
    });

    // Tastatur-Steuerung (Pfeiltasten & ESC)
    document.addEventListener('keydown', (e) => {
        if (!lightbox.classList.contains('active')) return;

        if (e.key === 'Escape') {
            lightbox.classList.remove('active');
        } else if (e.key === 'ArrowRight') {
            nextImgBtn.click();
        } else if (e.key === 'ArrowLeft') {
            prevImgBtn.click();
        }
    });
</script>
